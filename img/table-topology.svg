<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 620" width="100%" role="img" aria-labelledby="title desc">
<title id="title">Topologia circular de Codexion</title>
<desc id="desc">Ocho personas (C1-C8) sentadas en una mesa circular, cada una compartiendo un dongle (d1-d8) con su vecino inmediato, formando un anillo cerrado.</desc>
<rect x="1" y="1" width="638" height="618" rx="24" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
<circle cx="320" cy="300" r="200" fill="none" stroke="#8b98a8" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round"/>
<text x="320" y="292" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#1f2937">compilador</text>
<text x="320" y="319" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#1f2937">cuántico</text>
<text x="320" y="344" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#6b7280">(compartido)</text>
<rect x="380.5" y="102.2" width="32" height="26" rx="6" fill="#eef2f7" stroke="#5b6b7c" stroke-width="2"/>
<text x="410.3" y="82.0" text-anchor="middle" dominant-baseline="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#374151">d1</text>
<rect x="488.8" y="210.5" width="32" height="26" rx="6" fill="#eef2f7" stroke="#5b6b7c" stroke-width="2"/>
<text x="538.0" y="209.7" text-anchor="middle" dominant-baseline="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#374151">d2</text>
<rect x="488.8" y="363.5" width="32" height="26" rx="6" fill="#eef2f7" stroke="#5b6b7c" stroke-width="2"/>
<text x="538.0" y="390.3" text-anchor="middle" dominant-baseline="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#374151">d3</text>
<rect x="380.5" y="471.8" width="32" height="26" rx="6" fill="#eef2f7" stroke="#5b6b7c" stroke-width="2"/>
<text x="410.3" y="518.0" text-anchor="middle" dominant-baseline="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#374151">d4</text>
<rect x="227.5" y="471.8" width="32" height="26" rx="6" fill="#eef2f7" stroke="#5b6b7c" stroke-width="2"/>
<text x="229.7" y="518.0" text-anchor="middle" dominant-baseline="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#374151">d5</text>
<rect x="119.2" y="363.5" width="32" height="26" rx="6" fill="#eef2f7" stroke="#5b6b7c" stroke-width="2"/>
<text x="102.0" y="390.3" text-anchor="middle" dominant-baseline="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#374151">d6</text>
<rect x="119.2" y="210.5" width="32" height="26" rx="6" fill="#eef2f7" stroke="#5b6b7c" stroke-width="2"/>
<text x="102.0" y="209.7" text-anchor="middle" dominant-baseline="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#374151">d7</text>
<rect x="227.5" y="102.2" width="32" height="26" rx="6" fill="#eef2f7" stroke="#5b6b7c" stroke-width="2"/>
<text x="229.7" y="82.0" text-anchor="middle" dominant-baseline="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#374151">d8</text>
<circle cx="320.0" cy="100.0" r="30" fill="#2563eb" stroke="#ffffff" stroke-width="3"/>
<text x="320.0" y="106.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#ffffff">C1</text>
<circle cx="461.4" cy="158.6" r="30" fill="#16a34a" stroke="#ffffff" stroke-width="3"/>
<text x="461.4" y="164.6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#ffffff">C2</text>
<circle cx="520.0" cy="300.0" r="30" fill="#d97706" stroke="#ffffff" stroke-width="3"/>
<text x="520.0" y="306.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#ffffff">C3</text>
<circle cx="461.4" cy="441.4" r="30" fill="#dc2626" stroke="#ffffff" stroke-width="3"/>
<text x="461.4" y="447.4" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#ffffff">C4</text>
<circle cx="320.0" cy="500.0" r="30" fill="#7c3aed" stroke="#ffffff" stroke-width="3"/>
<text x="320.0" y="506.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#ffffff">C5</text>
<circle cx="178.6" cy="441.4" r="30" fill="#0891b2" stroke="#ffffff" stroke-width="3"/>
<text x="178.6" y="447.4" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#ffffff">C6</text>
<circle cx="120.0" cy="300.0" r="30" fill="#c026d3" stroke="#ffffff" stroke-width="3"/>
<text x="120.0" y="306.0" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#ffffff">C7</text>
<circle cx="178.6" cy="158.6" r="30" fill="#4d7c0f" stroke="#ffffff" stroke-width="3"/>
<text x="178.6" y="164.6" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#ffffff">C8</text>
<text x="320" y="592" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#6b7280">Ci = persona i &#183; di = dongle entre Ci y C(i+1)</text>
</svg>